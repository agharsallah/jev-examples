# Workspace root, so every example can be run from here:
#
#   uv sync
#   uv run tribunal judge "the dog ate my migration"
#   uv run outbox check "just circling back on this, no rush!"
#   uv run duel serve
#   uv run triage serve
#
# Nothing is published from this file; it only ties the examples together and
# gives them one shared virtualenv and one lockfile.

[project]
name = "jev-examples"
version = "0.0.0"
description = "Examples built on TypeSafe's System One models."
requires-python = ">=3.12"
dependencies = [
    "excuse-tribunal",
    "outbox",
    "tetris-duel",
    "triage",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["examples/*"]

[tool.uv.sources]
excuse-tribunal = { workspace = true }
outbox = { workspace = true }
tetris-duel = { workspace = true }
triage = { workspace = true }
