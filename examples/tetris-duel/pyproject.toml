[project]
name = "tetris-duel"
version = "0.1.0"
description = "A self-playing well with Jev at the controls, and one next to it for you."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.1",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
duel = "tetris_duel.cli:app"

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_duel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tetris_duel/cli.py" = ["E501"]
"src/tetris_duel/payload.py" = ["E501"]
