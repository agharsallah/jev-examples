[project]
name = "triage"
version = "0.1.0"
description = "Point it at any GitHub repo: Jev reads the labels, then every issue, and shows its working."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.1",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
triage = "triage.cli:app"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/triage/cli.py" = ["E501"]
# Question wording reads better unbroken than wrapped mid-sentence.
"src/triage/questions.py" = ["E501"]
