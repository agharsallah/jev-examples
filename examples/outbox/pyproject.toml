[project]
name = "outbox"
version = "0.1.0"
description = "A second opinion on anything you are about to send."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.1",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
outbox = "outbox.cli:app"

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/outbox/cli.py" = ["E501"]
